<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Bill Scherzer — Job Board</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0e27;--bg2:#1a2140;--bg3:#111830;
    --red:#ff6b6b;--yellow:#ffd93d;--darkgreen:#2d7a4f;--dg-text:#9fe3b8;--green:#6bcf7f;--blue:#74b9ff;
    --text:#fff;--text2:#cbd5e1;--border:#2d3a5f;
  }
  body{font-family:'Space Mono',monospace;background:var(--bg);color:var(--text)}
  .sidebar{background:var(--bg);min-height:100vh;padding:20px;max-width:900px;margin:0 auto}
  h1{font-size:18px;margin-bottom:2px}
  .sub{font-size:11px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  .poll{font-size:10px;color:var(--text2);float:right}

  /* Section headers */
  .section-head{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;padding:6px 0 10px;border-bottom:2px solid var(--border);margin:20px 0 12px}
  .section-head:first-child{margin-top:0}

  /* Stats bar */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .stat{background:var(--bg2);padding:12px 6px;border-radius:8px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all .2s;min-width:0;overflow:hidden}
  .stat:hover{transform:translateY(-2px);border-color:var(--blue)}
  .stat.active{border-color:var(--blue)}
  .stat-num{font-size:24px;font-weight:700;line-height:1.1}
  .stat-label{font-size:9px;color:var(--text2);text-transform:uppercase;margin-top:4px;line-height:1.2;word-break:break-word}

  /* Controls */
  .controls-bar{display:flex;gap:8px;margin-bottom:14px}
  .search-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none}
  .search-input:focus{border-color:var(--blue)}
  .search-input::placeholder{color:var(--text2)}

  /* Cards */
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .card{background:var(--bg2);border:2px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
  .card:hover{border-color:var(--blue);transform:translateY(-1px)}
  .card-name{font-size:14px;font-weight:700;margin-bottom:4px;line-height:1.3;overflow-wrap:anywhere}
  .card-sub{font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.4;overflow-wrap:anywhere}
  a.addr-link{color:var(--blue);text-decoration:none;cursor:pointer;display:inline-block}
  a.addr-link:hover{text-decoration:underline}
  a.card-sub.addr-link{display:block}
  .addr-pin{white-space:nowrap}
  .entity-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1px 5px;margin-bottom:4px}
  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:24px 0}

  /* Badges */
  .badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
  /* Camera statuses */
  .s-red     {background:rgba(255,107,107,.18);color:var(--red);    border:1px solid var(--red)}
  .s-yellow  {background:rgba(255,217,61,.18); color:var(--yellow); border:1px solid var(--yellow)}
  .s-darkgreen{background:rgba(45,122,79,.25); color:var(--dg-text);border:1px solid var(--darkgreen)}
  .s-green   {background:rgba(107,207,127,.18);color:var(--green);  border:1px solid var(--green)}
  .s-none    {background:rgba(45,58,95,.4);    color:var(--text2);  border:1px solid var(--border)}
  /* Repair app statuses */
  .s-dispatched  {background:rgba(255,107,107,.18);color:var(--red);    border:1px solid var(--red)}
  .s-in_progress {background:rgba(255,217,61,.18); color:var(--yellow); border:1px solid var(--yellow)}
  .s-finished    {background:rgba(45,122,79,.25);  color:var(--dg-text);border:1px solid var(--darkgreen)}
  .s-closed      {background:rgba(107,207,127,.18);color:var(--green);  border:1px solid var(--green)}
  .s-waiting     {background:rgba(116,185,255,.15);color:var(--blue);   border:1px solid var(--blue)}
  .s-other       {background:rgba(45,58,95,.4);    color:var(--text2);  border:1px solid var(--border)}

  /* Modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:flex-start;justify-content:center;padding:0;overflow:auto;-webkit-overflow-scrolling:touch}
  .modal.on{display:flex}
  .sheet{background:var(--bg);border:1px solid var(--border);border-radius:12px;max-width:620px;width:100%;margin:18px;min-height:min-content}
  @media(max-width:699px){.sheet{margin:0;border-radius:0;min-height:100dvh}}
  .sheet-h{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px;display:flex;justify-content:space-between;align-items:center;z-index:1;gap:10px}
  .sheet-h h2{font-size:15px;overflow-wrap:anywhere}
  .x{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .sheet-b{padding:14px}
  .fl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  .fl:first-child{margin-top:0}
  .val{font-size:13px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}

  /* Status buttons */
  .status-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .status-btn{flex:1 1 calc(50% - 8px);min-width:110px;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
  .status-btn:hover{filter:brightness(1.15)}
  .status-btn.cur{border-color:currentColor}
  .status-btn.b-red{color:var(--red)}         .status-btn.b-yellow{color:var(--yellow)}
  .status-btn.b-darkgreen{color:var(--dg-text)} .status-btn.b-green{color:var(--green)}
  .status-btn.b-dispatched{color:var(--red)}  .status-btn.b-in_progress{color:var(--yellow)}
  .status-btn.b-finished{color:var(--dg-text)} .status-btn.b-closed{color:var(--green)}

  /* Archived history */
  .archived-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
  .archived-hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;font-size:12px;flex-wrap:wrap}
  .archived-hdr:hover{background:rgba(255,255,255,.03)}
  .archived-body{display:none;padding:4px 11px 11px}
  .archived-body.open{display:block}

  /* Notes */
  .notes{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .note{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  .note-meta{font-size:10px;color:var(--text2);margin-bottom:3px}
  .note-text{font-size:13px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
  .note-img{margin-top:6px;max-width:140px;max-height:140px;border-radius:6px;border:1px solid var(--border);cursor:pointer;display:block}

  /* Activity log (repair tickets) */
  .activity{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .act-item{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px}
  .act-meta{font-size:10px;color:var(--text2);margin-bottom:2px}

  /* Inputs */
  textarea.note-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;min-height:60px;resize:vertical;outline:none;margin-top:4px}
  textarea.note-in:focus{border-color:var(--blue)}
  .date-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;outline:none}
  .date-in:focus{border-color:var(--blue)}
  .issue-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;min-height:50px;resize:vertical;outline:none}
  .issue-in:focus{border-color:var(--blue)}

  /* Buttons */
  .btn{padding:10px 14px;border:none;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--blue);color:#0a0e27}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-ghost{background:var(--bg2);border:1px solid var(--border);color:var(--text)}
  .btn-invoice{background:var(--bg2);color:var(--yellow);border:1px solid var(--yellow)}
  .cmt.invoice{border-color:var(--yellow)}
  .invoice-tag{color:var(--yellow);font-weight:700;font-size:10px;margin-left:6px}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .upload-note{font-size:11px;color:var(--text2);margin-top:6px}

  /* Photo grid */
  .photo-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .photo-grid img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer}

  /* Divider */
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;z-index:2000;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}  .toast.err{border-color:var(--red);color:var(--red)}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  @media(max-width:699px){
    .sidebar{padding:14px}
    .stats{gap:8px}
    .card-grid{grid-template-columns:1fr}
  }
  @media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function locId(l){ return (l.t+"_"+l.g).replace(/\./g,"_"); }
const LOC_MAP = {};
FULL_LOCS.forEach(l => { LOC_MAP[locId(l)] = l; });
function locName(lid){ return (LOC_MAP[lid]&&LOC_MAP[lid].n)||lid; }
function locAddr(lid){ return (LOC_MAP[lid]&&LOC_MAP[lid].a)||""; }
function isSpecial(lid){ return !!(LOC_MAP[lid]&&LOC_MAP[lid].special); }
// Each location carries its exact GPS coords (t=lat, g=lng). Build a maps link
// that opens the device's default map app for turn-by-turn navigation.
function locLL(lid){ const l=LOC_MAP[lid]; return (l&&typeof l.t==="number"&&typeof l.g==="number")?{lat:l.t,lng:l.g}:null; }
function mapsUrl(lid){ const ll=locLL(lid); return ll?`https://www.google.com/maps/search/?api=1&query=${ll.lat},${ll.lng}`:""; }

let curFilter  = "ns";
let curSearch  = "";
let openItem   = null; // { type:"cam"|"rm", id, tkId? }

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg,kind){ const t=$("toast");t.textContent=msg;t.className="toast on"+(kind==="err"?" err":"");setTimeout(()=>t.className="toast",2400); }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }
function now(){ return Date.now(); }
function uid(){ return now().toString(36)+Math.random().toString(36).slice(2,7); }

// ── Camera helpers ────────────────────────────────────────────────────────────
function getSortedTickets(locData){
  if(!locData||!locData.tickets) return [];
  return Object.entries(locData.tickets)
    .map(([id,t])=>({id,...t}))
    .sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
}
function getOpenTicket(locData){
  if(!locData||!locData.tickets) return null;
  return Object.values(locData.tickets).find(t=>!t.archived)||null;
}
function getOpenTicketId(locData){
  if(!locData||!locData.tickets) return null;
  return Object.keys(locData.tickets).find(k=>!locData.tickets[k].archived)||null;
}
function camEffective(locData){
  const open=getOpenTicket(locData);
  if(open) return {ticket:open,isOpen:true};
  const all=getSortedTickets(locData);
  if(all.length) return {ticket:all[all.length-1],isOpen:false};
  return null;
}
function camUrgency(s){ return (CAM_STATUS[s||"red"]||{urgency:0}).urgency; }

// ── Repair app helpers ────────────────────────────────────────────────────────
function rmStoreName(sid){ return (RM_RESTS[sid]&&RM_RESTS[sid].storeName)||sid||"Unknown store"; }
function rmStoreAddr(sid){ const r=RM_RESTS[sid]; return (r&&(r.address||r.storeAddress))||""; }
// Entity (brand) derived from the store name, e.g. "Burger King #23086 Atlanta".
function rmStoreEntity(sid){
  const r=RM_RESTS[sid]||{};
  if(r.entity||r.brand||r.concept) return r.entity||r.brand||r.concept;
  const m=(r.storeName||"").match(/^\s*(.+?)\s*#/);
  return m?m[1].trim():"";
}
// Build a name→camera-location and address→camera-location index so repair-app
// stores can inherit exact GPS coords from the camera location table.
const _normAddr=s=>String(s||"").toLowerCase().replace(/[.,#]/g,"").replace(/\s+/g," ").trim();
const _normName=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const LOC_BY_ADDR={}, LOC_BY_NAME={};
FULL_LOCS.forEach(l=>{ if(l.a) LOC_BY_ADDR[_normAddr(l.a)]=l; if(l.n) LOC_BY_NAME[_normName(l.n)]=l; });
// GPS for a repair store: prefer its own lat/lng, else match a camera location by
// address or name, else fall back to a text address query so the pin still works.
function rmMapsUrl(sid){
  const r=RM_RESTS[sid]||{};
  // The API sends latitude/longitude as STRINGS — coerce before using them.
  const lat=parseFloat(r.latitude!=null?r.latitude:r.lat);
  const lng=parseFloat(r.longitude!=null?r.longitude:r.lng);
  if(isFinite(lat)&&isFinite(lng)) return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  const addr=rmStoreAddr(sid);
  let m = addr && LOC_BY_ADDR[_normAddr(addr)];
  if(!m){ const nm=rmStoreName(sid); m=LOC_BY_NAME[_normName(nm)]; }
  if(m) return `https://www.google.com/maps/search/?api=1&query=${m.t},${m.g}`;
  if(addr) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
  return "";
}
function rmUrgency(s){ return (RM_STATUS[s]||{urgency:0}).urgency; }
function rmStatusView(s){
  if(RM_STATUS[s]) return RM_STATUS[s];
  if(s==="waiting") return {label:"On Hold",urgency:0,cls:"waiting"};
  return {label:(s||"—").replace(/_/g," "),urgency:0,cls:"other"};
}

// ── RM API ───────────────────────────────────────────────────────────────────
async function loadRM(){
  const r = await fetch(`${RM_API}?vendor=${encodeURIComponent(VENDOR_NAME)}`,{cache:"no-store"});
  if(!r.ok) throw new Error("Repair API unreachable");
  const data = await r.json();
  RM_TICKETS = data.maintenanceTickets || {};
  RM_RESTS   = data.restaurants        || {};
  RM_KEY     = data.vendorKey          || null;
  if(!RM_KEY) $("boardSub").textContent = (($("boardSub").textContent||"")+(" · ⚠ "+VENDOR_NAME+" not found in vendor list")).trim();
}
async function rmWriteTicket(id, ticket){
  const updates = {}; updates[`maintenanceTickets/${id}`] = ticket;
  const r = await fetch(RM_API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:RM_PASS,vendorId:(RM_KEY||VENDOR_NAME),updates})});
  if(!r.ok){ let m="Write failed"; try{m=(await r.json()).error||m}catch(e){} throw new Error(m); }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
// Unified stats bar: "Not Started / In Progress / Done & Unpaid / Done & Paid"
// across both systems (cam red=dispatched, etc.)
function renderStats(){
  const counts = {ns:0, ip:0, dup:0, dap:0};
  // Camera: open tickets only
  Object.entries(CAM_DATA).forEach(([lid,locData])=>{
    if(isSpecial(lid)) return;
    const open=getOpenTicket(locData); if(!open) return;
    const s=open.s||"red";
    if(s==="red") counts.ns++;
    else if(s==="yellow") counts.ip++;
    else if(s==="darkgreen") counts.dup++;
    else if(s==="green") counts.dap++;
  });
  // Repair: dispatched-flow tickets
  Object.values(RM_TICKETS).forEach(t=>{
    if(t.status==="dispatched") counts.ns++;
    else if(t.status==="in_progress") counts.ip++;
    else if(t.status==="finished") counts.dup++;
    else if(t.status==="closed") counts.dap++;
  });
  const items=[
    {key:"ns",  label:"Not Started",   color:"red"},
    {key:"ip",  label:"In Progress",   color:"yellow"},
    {key:"dup", label:"Done & Unpaid", color:"darkgreen"},
    {key:"dap", label:"Done & Paid",   color:"green"},
  ];
  $("stats").innerHTML = items.map(it=>`
    <div class="stat${curFilter===it.key?" active":""}" onclick="window.toggleFilter('${it.key}')">
      <div class="stat-num" style="color:var(--${it.color})">${counts[it.key]}</div>
      <div class="stat-label">${esc(it.label)}</div></div>`).join("");
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  renderStats();
  const q = curSearch.toLowerCase();

  // ── Camera section ──
  let camEntries = Object.entries(CAM_DATA)
    .filter(([lid])=>!isSpecial(lid))
    .map(([lid,locData])=>{ const et=camEffective(locData); return et?{lid,locData,...et}:null; })
    .filter(Boolean);

  if(curFilter){
    const fMap={ns:"red",ip:"yellow",dup:"darkgreen",dap:"green"};
    const fs=fMap[curFilter];
    camEntries=camEntries.filter(e=>e.isOpen&&(e.ticket.s||"red")===fs);
  }
  if(q) camEntries=camEntries.filter(e=>
    locName(e.lid).toLowerCase().includes(q)||
    locAddr(e.lid).toLowerCase().includes(q)||
    (e.ticket.issue||"").toLowerCase().includes(q));

  camEntries.sort((a,b)=>{
    if(a.isOpen!==b.isOpen) return a.isOpen?-1:1;
    if(a.isOpen&&b.isOpen){ const d=camUrgency(b.ticket.s)-camUrgency(a.ticket.s); if(d) return d; }
    return locName(a.lid).localeCompare(locName(b.lid));
  });

  // ── Repair section ──
  let rmEntries = Object.entries(RM_TICKETS)
    .map(([id,t])=>({id,t}));

  if(curFilter){
    const fMap={ns:"dispatched",ip:"in_progress",dup:"finished",dap:"closed"};
    const fs=fMap[curFilter];
    rmEntries=rmEntries.filter(e=>e.t.status===fs);
  }
  if(q) rmEntries=rmEntries.filter(e=>
    rmStoreName(e.t.storeId).toLowerCase().includes(q)||
    (e.t.description||"").toLowerCase().includes(q)||
    (e.t.shortId||"").toLowerCase().includes(q)||
    (e.t.category||"").toLowerCase().includes(q));

  rmEntries.sort((a,b)=>rmUrgency(b.t.status)-rmUrgency(a.t.status)||(b.t.createdAt||0)-(a.t.createdAt||0));

  // ── Render list ──
  const list=$("list");
  if(!camEntries.length&&!rmEntries.length){
    list.innerHTML=`<div class="empty">No jobs match this view.</div>`;
    return;
  }

  const mkCamCard=e=>{
    const s=e.ticket.s||"red";
    const info=CAM_STATUS[s]||{label:s};
    const statusBadge=e.isOpen?`<span class="badge s-${s}">${esc(info.label)}</span>`:`<span class="badge s-none">Completed</span>`;
    const dateBadge=e.ticket.v?`<span class="badge s-none">📅 ${esc(e.ticket.v)}</span>`:"";
    const histBadge=!e.isOpen?`<span class="badge s-none">📁 History</span>`:"";
    return `<div class="card" onclick="window.openCam('${esc(e.lid)}')">
      <div class="card-name">${esc(locName(e.lid))}</div>
      ${locAddr(e.lid)?(mapsUrl(e.lid)?`<a href="${mapsUrl(e.lid)}" target="_blank" rel="noopener" class="card-sub addr-link" onclick="event.stopPropagation()">${esc(locAddr(e.lid))} <span class="addr-pin">📍</span></a>`:`<div class="card-sub">${esc(locAddr(e.lid))}</div>`):""}
      <div class="card-meta">${statusBadge}${dateBadge}${histBadge}</div>
    </div>`;
  };

  const mkRmCard=({id,t})=>{
    const sv=rmStatusView(t.status);
    const cat=t.category?t.category.charAt(0).toUpperCase()+t.category.slice(1):"";
    const addr=rmStoreAddr(t.storeId), mu=rmMapsUrl(t.storeId);
    const addrHtml=(addr||mu)
      ? `<a href="${mu}" target="_blank" rel="noopener" class="card-sub addr-link" onclick="event.stopPropagation()">${esc(addr||"Open in Maps")} <span class="addr-pin">📍</span></a>`
      : "";
    return `<div class="card" onclick="window.openRM('${esc(id)}')">
      ${rmStoreEntity(t.storeId)?`<div class="entity-tag">${esc(rmStoreEntity(t.storeId))}</div>`:""}
      <div class="card-name">${esc(rmStoreName(t.storeId))}${t.shortId?` <span style="color:var(--text2);font-weight:400;font-size:11px">#${esc(t.shortId)}</span>`:""}
      </div>
      ${addrHtml}
      ${t.description?`<div class="card-sub">${cat?`[${esc(cat)}] `:""}${esc((t.description||"").slice(0,60))}${(t.description||"").length>60?"…":""}</div>`:""}
      <div class="card-meta"><span class="badge s-${sv.cls}">${esc(sv.label)}</span></div>
    </div>`;
  };

  let html="";
  if(rmEntries.length){
    html+=`<div class="section-head">🔧 Repair Jobs (${rmEntries.length})</div>`;
    html+=`<div class="card-grid">${rmEntries.map(mkRmCard).join("")}</div>`;
  }
  if(camEntries.length){
    html+=`<div class="section-head">📷 Camera Jobs (${camEntries.length})</div>`;
    html+=`<div class="card-grid">${camEntries.map(mkCamCard).join("")}</div>`;
  }
  list.innerHTML=html;

  // subheader
  const rmOpen=Object.values(RM_TICKETS).filter(t=>RM_STATUS[t.status]).length;
  const camOpen=Object.values(CAM_DATA).filter((_,i)=>{
    const lid=Object.keys(CAM_DATA)[i]; return !isSpecial(lid)&&getOpenTicket(CAM_DATA[lid]);
  }).length;
  $("boardSub").textContent=`${rmOpen+camOpen} active job${(rmOpen+camOpen)===1?"":"s"} · repair ${rmOpen} · camera ${camOpen}`;
}

window.toggleFilter=function(k){ if(curFilter===k) return; curFilter=k; render(); };
window.onSearch=function(v){ curSearch=(v||"").trim(); render(); };
window.lightbox=function(u){ $("lightboxImg").src=u; $("lightbox").classList.add("on"); };

// ── Camera detail sheet ───────────────────────────────────────────────────────
window.openCam=function(lid){
  openItem={type:"cam",lid};
  renderCamSheet(lid);
  $("modal").classList.add("on");
  document.body.style.overflow="hidden";
};

function renderCamSheet(lid){
  const locData=CAM_DATA[lid];
  if(!locData) return;
  const all=getSortedTickets(locData);
  const archived=all.filter(t=>t.archived);
  const open=all.find(t=>!t.archived)||null;
  const tkId=getOpenTicketId(locData);

  let histHtml="";
  if(archived.length){
    const rows=archived.map((t,idx)=>{
      const s=t.s||"red"; const info=CAM_STATUS[s]||{label:s};
      const displayDate=t.v||(t.createdAt?new Date(t.createdAt).toLocaleDateString():"No date");
      const notesHtml=(t.notes||[]).map(n=>`
        <div class="note" style="margin-top:6px">
          <div class="note-meta">${esc(fmtDate(n.t))}</div>
          ${n.n?`<div class="note-text">${esc(n.n)}</div>`:""}
          ${n.photoUrl?`<img class="note-img" src="${esc(n.photoUrl)}" onclick="window.lightbox('${esc(n.photoUrl)}')">`:""}
        </div>`).join("");
      const body=(t.issue?`<div class="fl" style="margin-top:8px">Issue</div><div class="val">${esc(t.issue)}</div>`:"")+
        (notesHtml?`<div class="fl" style="margin-top:8px">Notes</div>${notesHtml}`:"")+
        (!t.issue&&!notesHtml?`<div style="color:var(--text2);font-size:12px;margin-top:6px">No details recorded.</div>`:"");
      return `<div class="archived-item">
        <div class="archived-hdr" onclick="this.nextElementSibling.classList.toggle('open')">
          <span>Ticket #${idx+1} — ${esc(displayDate)}</span>
          <span class="badge s-${s}" style="font-size:10px">${esc(info.label)}</span>
        </div>
        <div class="archived-body">${body}</div>
      </div>`;
    }).join("");
    histHtml=`<div class="fl">📁 History (${archived.length})</div>${rows}<hr class="divider">`;
  }

  // Camera is historical / read-only. Show last open ticket as a read-only record.
  let openHtml="";
  if(open){
    const s=open.s||"red"; const info=CAM_STATUS[s]||{label:s};
    const notesHtml=(open.notes||[]).map(n=>`
      <div class="note">
        <div class="note-meta">${esc(fmtDate(n.t))}</div>
        ${n.n?`<div class="note-text">${esc(n.n)}</div>`:""}
        ${n.photoUrl?`<img class="note-img" src="${esc(n.photoUrl)}" onclick="window.lightbox('${esc(n.photoUrl)}')">`:""}
      </div>`).join("")||`<div style="color:var(--text2);font-size:13px">No notes recorded.</div>`;
    openHtml=`
      <div class="fl">🎫 Last recorded job</div>
      <div style="margin-bottom:8px"><span class="badge s-${s}">${esc(info.label)}</span>${open.v?` <span class="badge s-none">📅 ${esc(open.v)}</span>`:""}</div>
      ${open.issue?`<div class="fl">Issue</div><div class="val" style="margin-bottom:10px">${esc(open.issue)}</div>`:""}
      <div class="fl">Notes</div>
      <div class="notes">${notesHtml}</div>`;
  } else {
    openHtml=`<div style="color:var(--text2);font-size:13px;padding:8px 0">No open job recorded at this location.</div>`;
  }

  $("sheet").innerHTML=`
    <div class="sheet-h"><h2>📷 ${esc(locName(lid))}</h2><button class="x" onclick="window.closeModal()">✕ Close</button></div>
    <div class="sheet-b">
      <div style="font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:12px">
        📋 Historical record from camera tracker — view only. New jobs come through the repair app.
      </div>
      <div class="fl" style="margin-top:0">Address</div><div class="val">${(function(){const a=locAddr(lid);const u=mapsUrl(lid);if(!a&&!u)return "—";if(u)return `<a href="${u}" target="_blank" rel="noopener" class="addr-link">${esc(a||"Open in Maps")} <span class="addr-pin">📍</span></a>`;return esc(a);})()}</div>
      ${histHtml}${openHtml}
    </div>`;
}


// ── Repair ticket detail sheet ────────────────────────────────────────────────
window.openRM=function(id){
  openItem={type:"rm",id};
  renderRMSheet(id);
  $("modal").classList.add("on");
  document.body.style.overflow="hidden";
};

function renderRMSheet(id){
  const t=RM_TICKETS[id]; if(!t) return;
  const sv=rmStatusView(t.status);
  const cat=t.category?t.category.charAt(0).toUpperCase()+t.category.slice(1):"";

  const statusBtns=RM_FLOW.map(s=>{
    const si=RM_STATUS[s]; const cur=t.status===s?" cur":"";
    return `<button class="status-btn b-${s}${cur}" onclick="window.rmSetStatus('${esc(id)}','${s}')">${esc(si.label)}</button>`;
  }).join("");

  const photos=Array.isArray(t.photos)?t.photos:[];
  const photoHtml=photos.length?`<div class="fl">Photos</div><div class="photo-grid">${photos.map(u=>`<img src="${esc(u)}" onclick="window.lightbox('${esc(u)}')">`).join("")}</div>`:"";

  const activity=Array.isArray(t.activity)?t.activity:[];
  const actHtml=activity.length?activity.slice(-8).reverse().map(a=>`
    <div class="act-item">
      <div class="act-meta">${esc(a.by||"")} · ${fmtDate(a.ts)}</div>
      <div>${esc(a.note||a.action||"")}</div>
    </div>`).join(""):`<div style="color:var(--text2);font-size:13px">No activity yet.</div>`;

  const comments=Array.isArray(t.comments)?t.comments:[];
  const cmtHtml=comments.length?comments.map(c=>{
    const isInv=!!c.invoice;
    const img=c.fileUrl?`<img class="note-img" src="${esc(c.fileUrl)}" onclick="window.lightbox('${esc(c.fileUrl)}')">`:"";
    const del=(isInv&&c.id)?`<button class="cmt-del" onclick="window.rmDeleteInvoice('${id}','${esc(c.id)}')">🗑 Delete invoice</button>`:"";
    return `<div class="note${isInv?" cmt invoice":""}">
      <div class="note-meta">${esc(c.by||"")} · ${fmtDate(c.ts)}${isInv?' <span class="invoice-tag">🧾 Invoice</span>':''}</div>
      ${c.text?`<div class="note-text">${esc(c.text)}</div>`:""}
      ${img}${del}</div>`;
  }).join(""):`<div style="color:var(--text2);font-size:13px">No comments yet.</div>`;

  // Other tickets at the same store
  const siblings=Object.entries(RM_TICKETS).filter(([sid,x])=>x.storeId===t.storeId&&sid!==id)
    .sort(([,a],[,b])=>(b.createdAt||0)-(a.createdAt||0));
  const siblingHtml=siblings.length?`<div class="fl">Other jobs at this store</div>`+
    siblings.map(([sid,x])=>{const sv=rmStatusView(x.status);
      return `<div class="card" style="margin-bottom:6px" onclick="window.openRM('${sid}')">
        <div class="card-meta"><span class="badge s-${sv.cls}">${esc(sv.label)}</span>
        <span style="font-size:11px;color:var(--text2);margin-left:4px">#${esc(x.shortId||sid.slice(0,6))} — ${esc((x.description||"").slice(0,40))}${(x.description||"").length>40?"…":""}</span></div>
      </div>`;}).join(""):"";

  $("sheet").innerHTML=`
    <div class="sheet-h">
      <h2>🔧 ${esc(rmStoreName(t.storeId))}${t.shortId?` · #${esc(t.shortId)}`:""}</h2>
      <button class="x" onclick="window.closeModal()">✕ Close</button>
    </div>
    <div class="sheet-b">
      <div class="fl" style="margin-top:0">Address</div>
      <div class="val">${(function(){const a=rmStoreAddr(t.storeId),u=rmMapsUrl(t.storeId);if(!a&&!u)return "—";if(u)return `<a href="${u}" target="_blank" rel="noopener" class="addr-link">${esc(a||"Open in Maps")} <span class="addr-pin">📍</span></a>`;return esc(a);})()}</div>
      <div class="fl">Status</div>
      <div class="status-row">${statusBtns}</div>
      <div class="fl">Job</div>
      <div class="val">${cat?`[${esc(cat)}] `:""}${esc(t.description||"(no description)")}</div>
      ${photoHtml}
      <div class="fl">Activity</div>
      <div class="activity">${actHtml}</div>
      <div class="fl">Comments</div>
      <div class="notes" id="rmCmts">${cmtHtml}</div>
      <div class="fl">Add comment</div>
      <textarea class="note-in" id="rmCmtIn" placeholder="Type a comment…"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-primary" id="rmCmtSend" onclick="window.rmPostComment('${esc(id)}')" style="flex:1;min-width:140px">Post comment</button>
        <input type="file" accept="image/*" id="rmInvFile" style="display:none" onchange="window.rmUploadInvoice('${esc(id)}',this)">
        <button class="btn btn-invoice" id="rmInvBtn" onclick="document.getElementById('rmInvFile').click()" style="flex:1;min-width:140px">🧾 Add Invoice</button>
      </div>
      <div class="upload-note" id="rmInvStatus"></div>
      ${siblingHtml}
    </div>`;
}

// Repair writes
window.rmSetStatus=async function(id,s){
  const t=RM_TICKETS[id]; if(!t||t.status===s) return;
  const activity=Array.isArray(t.activity)?t.activity.slice():[];
  activity.push({ts:now(),by:VENDOR_NAME,role:"vendor",action:"status",toStatus:s,note:"via vendor board"});
  const updated={...t,status:s,activity,updatedAt:now()}; delete updated._id;
  try{
    await rmWriteTicket(id,updated);
    RM_TICKETS[id]=updated; toast("Status → "+rmStatusView(s).label); renderRMSheet(id); render();
  }catch(e){ toast(e.message||"Update failed","err"); }
};
window.rmPostComment=async function(id){
  const inp=$("rmCmtIn"); const text=(inp&&inp.value||"").trim(); if(!text){toast("Write something first","err");return;}
  const btn=$("rmCmtSend"); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}
  const t=RM_TICKETS[id]; if(!t){toast("Ticket not found","err");if(btn){btn.disabled=false;btn.textContent="Post comment";}return;}
  const comments=Array.isArray(t.comments)?t.comments.slice():[];
  comments.push({id:uid(),by:VENDOR_NAME,role:"vendor",text,ts:now()});
  const updated={...t,comments,updatedAt:now()}; delete updated._id;
  try{
    await rmWriteTicket(id,updated); RM_TICKETS[id]=updated; toast("Comment posted"); renderRMSheet(id);
  }catch(e){ toast(e.message||"Failed","err"); }
  finally{ if(btn){btn.disabled=false;btn.textContent="Post comment";} }
};

window.rmUploadInvoice=async function(id,inputEl){
  const file=inputEl.files&&inputEl.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ toast("Invoice must be an image (screenshot is fine).","err"); inputEl.value=""; return; }
  const status=$("rmInvStatus"); const btn=$("rmInvBtn");
  if(status) status.textContent="Uploading invoice…"; if(btn) btn.disabled=true;
  try{
    const fd=new FormData(); fd.append("image",file);
    const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,{method:"POST",body:fd});
    const json=await res.json();
    if(!json.success) throw new Error((json.error&&json.error.message)||"Upload failed");
    const url=json.data.url;
    const t=RM_TICKETS[id];
    const comments=Array.isArray(t.comments)?t.comments.slice():[];
    comments.push({id:uid(),by:VENDOR_NAME,role:"vendor",text:"Invoice",ts:now(),invoice:true,fileUrl:url});
    const updated={...t,comments,updatedAt:now()}; delete updated._id;
    await rmWriteTicket(id,updated); RM_TICKETS[id]=updated;
    toast("🧾 Invoice added"); renderRMSheet(id);
  }catch(e){
    if(status) status.textContent=""; if(btn) btn.disabled=false;
    toast("Invoice upload failed: "+(e.message||e),"err");
  }finally{ inputEl.value=""; }
};

window.rmDeleteInvoice=async function(id,commentId){
  const t=RM_TICKETS[id]; if(!t) return;
  const comments=Array.isArray(t.comments)?t.comments:[];
  const target=comments.find(c=>c&&c.id===commentId&&c.invoice);
  if(!target){ toast("Invoice not found","err"); return; }
  if(!confirm("Delete this invoice? This can't be undone.")) return;
  const next=comments.filter(c=>!(c&&c.id===commentId&&c.invoice));
  const updated={...t,comments:next,updatedAt:now()}; delete updated._id;
  try{
    await rmWriteTicket(id,updated); RM_TICKETS[id]=updated;
    toast("Invoice deleted"); renderRMSheet(id);
  }catch(e){ toast(e.message||"Delete failed","err"); }
};

window.closeModal=function(){
  $("modal").classList.remove("on"); document.body.style.overflow=""; openItem=null;
};

// Camera: live Firebase listener
onValue(ref(db,"jobs"),snap=>{
  CAM_DATA=snap.val()||{};
  $("poll").textContent="live";
  render();
  if(openItem&&openItem.type==="cam"){
    const active=document.activeElement;
    const typing=active&&active.id==="noteIn";
    if(!typing) renderCamSheet(openItem.lid);
  }
});

// Repair app: poll every 20s
async function pollRM(){
  const dot=$("poll"); dot.textContent="syncing…";
  try{
    const typing=document.activeElement&&document.activeElement.id==="rmCmtIn";
    await loadRM();
    if(!typing) render();
    if(openItem&&openItem.type==="rm"&&!typing) renderRMSheet(openItem.id);
  }catch(e){ console.warn("RM poll failed:",e.message); }
  dot.textContent="live";
}
pollRM();
setInterval(pollRM,POLL_MS);

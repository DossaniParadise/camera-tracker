<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Bill Scherzer — Camera Job Board</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0e27;--bg2:#1a2140;--bg3:#111830;
    --red:#ff6b6b;--yellow:#ffd93d;--darkgreen:#2d7a4f;--dg-text:#9fe3b8;--green:#6bcf7f;--blue:#74b9ff;
    --text:#fff;--text2:#cbd5e1;--border:#2d3a5f;
  }
  body{font-family:'Space Mono',monospace;background:var(--bg);color:var(--text)}
  .sidebar{background:var(--bg);min-height:100vh;padding:20px;max-width:900px;margin:0 auto}
  .sidebar h1{font-size:18px;margin-bottom:2px}
  .sub{font-size:11px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  .poll{font-size:10px;color:var(--text2);float:right}

  /* Stats bar — 4 camera statuses */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .stat{background:var(--bg2);padding:12px 6px;border-radius:8px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all .2s;min-width:0;overflow:hidden}
  .stat:hover{transform:translateY(-2px);border-color:var(--blue)}
  .stat.active{border-color:var(--blue)}
  .stat-num{font-size:24px;font-weight:700;line-height:1.1}
  .stat-label{font-size:9px;color:var(--text2);text-transform:uppercase;margin-top:4px;line-height:1.2;word-break:break-word}

  /* Controls */
  .controls-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
  .search-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;outline:none}
  .search-input:focus{border-color:var(--blue)}
  .search-input::placeholder{color:var(--text2)}

  /* Location cards */
  .location-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .location-column{display:flex;flex-direction:column;gap:8px}
  .column-header{font-size:12px;font-weight:700;color:var(--text2);padding:8px 0;border-bottom:2px solid var(--border);margin-bottom:4px}
  .no-results{grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px;padding:30px 0}
  .card{background:var(--bg2);border:2px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
  .card:hover{border-color:var(--blue);transform:translateY(-1px)}
  .card-name{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.3;overflow-wrap:anywhere}
  .card-addr{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.4;overflow-wrap:anywhere}
  .card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:40px 0}

  /* Status badges */
  .badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
  .s-red     {background:rgba(255,107,107,.18);color:var(--red);    border:1px solid var(--red)}
  .s-yellow  {background:rgba(255,217,61,.18); color:var(--yellow); border:1px solid var(--yellow)}
  .s-darkgreen{background:rgba(45,122,79,.25); color:var(--dg-text);border:1px solid var(--darkgreen)}
  .s-green   {background:rgba(107,207,127,.18);color:var(--green);  border:1px solid var(--green)}
  .s-none    {background:rgba(45,58,95,.4);    color:var(--text2);  border:1px solid var(--border)}

  /* Modal */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:flex-start;justify-content:center;padding:0;overflow:auto;-webkit-overflow-scrolling:touch}
  .modal.on{display:flex}
  .sheet{background:var(--bg);border:1px solid var(--border);border-radius:12px;max-width:620px;width:100%;margin:18px;min-height:min-content}
  @media(max-width:699px){.sheet{margin:0;border-radius:0;min-height:100dvh}}
  .sheet-h{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px;display:flex;justify-content:space-between;align-items:center;z-index:1}
  .sheet-h h2{font-size:16px;overflow-wrap:anywhere}
  .x{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
  .sheet-b{padding:14px}
  .field-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  .field-label:first-child{margin-top:0}
  .val{font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}

  /* Status buttons in detail */
  .status-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .status-btn{flex:1 1 calc(50% - 8px);min-width:120px;padding:11px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
  .status-btn:hover{filter:brightness(1.15)}
  .status-btn.cur{border-color:currentColor}
  .status-btn.b-red{color:var(--red)}
  .status-btn.b-yellow{color:var(--yellow)}
  .status-btn.b-darkgreen{color:var(--dg-text)}
  .status-btn.b-green{color:var(--green)}

  /* Notes list */
  .notes{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .note{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  .note-meta{font-size:10px;color:var(--text2);margin-bottom:3px}
  .note-text{font-size:13px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
  .note-img{margin-top:6px;max-width:140px;max-height:140px;border-radius:6px;border:1px solid var(--border);cursor:pointer;display:block}

  /* Add note */
  textarea.note-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;min-height:60px;resize:vertical;outline:none;margin-top:6px}
  textarea.note-in:focus{border-color:var(--blue)}
  .date-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;outline:none}
  .date-in:focus{border-color:var(--blue)}
  .issue-in{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:10px;min-height:50px;resize:vertical;outline:none}
  .issue-in:focus{border-color:var(--blue)}

  /* Buttons */
  .btn{padding:10px 14px;border:none;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--blue);color:#0a0e27}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn[disabled]{opacity:.5;cursor:default}
  .upload-note{font-size:11px;color:var(--text2);margin-top:6px}

  /* Photo grid */
  .photo-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .photo-grid img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer}

  /* Spinner + toast */
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;z-index:2000;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
  .toast.err{border-color:var(--red);color:var(--red)}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;align-items:center;justify-content:center;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  .btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

  @media(max-width:699px){
    .sidebar{padding:14px}
    .stats{gap:8px}
    .location-list{grid-template-columns:1fr;gap:16px}
    .card{padding:14px}
    .card-name{font-size:16px}
  }
  @media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

// Build locId → loc lookup (same formula as camera tracker)
const LOC_MAP = {};  // locId → {n, a, special}
FULL_LOCS.forEach(l => { LOC_MAP[locId(l)] = l; });

function locName(lid){ return (LOC_MAP[lid] && LOC_MAP[lid].n) || lid; }
function locAddr(lid){ return (LOC_MAP[lid] && LOC_MAP[lid].a) || ""; }
function isSpecial(lid){ return !!(LOC_MAP[lid] && LOC_MAP[lid].special); }

function getOpenTicket(locData){
  if(!locData || !locData.tickets) return null;
  return Object.values(locData.tickets).find(t => !t.archived) || null;
}
function getOpenTicketId(locData){
  if(!locData || !locData.tickets) return null;
  return Object.keys(locData.tickets).find(k => !locData.tickets[k].archived) || null;
}

// Locs with an open (non-archived) ticket — what Bill needs to see
function openLocs(){
  return Object.entries(DATA)
    .filter(([lid, locData]) => !isSpecial(lid) && getOpenTicket(locData))
    .map(([lid, locData]) => ({ lid, locData, ticket: getOpenTicket(locData) }));
}

// ── Stats + render ────────────────────────────────────────────────────────────
function renderStats(){
  const counts = { red:0, yellow:0, darkgreen:0, green:0 };
  openLocs().forEach(({ticket}) => {
    const s = ticket.s || "red";
    if(counts[s] !== undefined) counts[s]++;
  });
  const order = STATUS_FLOW;
  $("stats").innerHTML = order.map(s => {
    const info = STATUS_INFO[s];
    const on = curFilter===s ? " active" : "";
    return `<div class="stat${on}" onclick="window.toggleFilter('${s}')">
      <div class="stat-num" style="color:var(--${s})">${counts[s]}</div>
      <div class="stat-label">${esc(info.label)}</div></div>`;
  }).join("");
}

function render(){
  renderStats();

  let entries = openLocs();

  // Status filter
  if(curFilter) entries = entries.filter(e => (e.ticket.s||"red") === curFilter);

  // Search
  if(curSearch){
    const q = curSearch.toLowerCase();
    entries = entries.filter(e =>
      locName(e.lid).toLowerCase().includes(q) ||
      locAddr(e.lid).toLowerCase().includes(q) ||
      (e.ticket.issue||"").toLowerCase().includes(q)
    );
  }

  const list = $("list");
  if(!entries.length){
    list.innerHTML = `<div class="no-results">No open camera jobs${curFilter||curSearch ? " match this view" : ""}.</div>`;
    return;
  }

  // Sort: red → yellow → darkgreen → green, then alphabetically
  const urgency = s => STATUS_INFO[s||"red"] ? STATUS_INFO[s||"red"].urgency : 0;
  entries.sort((a, b) => {
    const ud = urgency(b.ticket.s) - urgency(a.ticket.s);
    if(ud !== 0) return ud;
    return locName(a.lid).localeCompare(locName(b.lid));
  });

  // Two columns: Burger King / everything else
  const bk = entries.filter(e => locName(e.lid).includes("Burger King") || locName(e.lid).includes("Subway"));
  const cs = entries.filter(e => !locName(e.lid).includes("Burger King") && !locName(e.lid).includes("Subway"));

  const mkCard = ({ lid, ticket }) => {
    const s = ticket.s || "red";
    const info = STATUS_INFO[s] || { label: s };
    return `<div class="card" onclick="window.openLoc('${esc(lid)}')">
      <div class="card-name">${esc(locName(lid))}</div>
      ${locAddr(lid) ? `<div class="card-addr">${esc(locAddr(lid))}</div>` : ""}
      <div class="card-meta">
        <span class="badge s-${s}">${esc(info.label)}</span>
        ${ticket.v ? `<span class="badge s-none" style="font-size:10px">📅 ${esc(ticket.v)}</span>` : ""}
      </div>
    </div>`;
  };

  const col = (header, items) => items.length ? `<div class="location-column">
    <div class="column-header">${header} (${items.length})</div>
    ${items.map(mkCard).join("")}
  </div>` : "";

  list.innerHTML = col("Burger King / Subway", bk) + col("C-Store / Other", cs);

  // If only one column has results, span it full width
  if(!bk.length || !cs.length) list.style.gridTemplateColumns = "1fr";
  else list.style.gridTemplateColumns = "";
}

window.toggleFilter = function(s){ curFilter = curFilter===s ? null : s; render(); };
window.onSearch     = function(v){ curSearch = (v||"").trim(); render(); };

// ── Detail sheet ──────────────────────────────────────────────────────────────
window.openLoc = function(lid){
  const locData = DATA[lid];
  if(!locData) return;
  const tkId   = getOpenTicketId(locData);
  const ticket = locData.tickets && tkId ? locData.tickets[tkId] : null;
  if(!ticket){ toast("No open ticket at this location","err"); return; }
  openLid  = lid;
  openTkId = tkId;
  renderSheet();
  $("modal").classList.add("on");
  document.body.style.overflow = "hidden";
};

function renderSheet(){
  const locData = DATA[openLid];
  if(!locData || !openTkId) return;
  const ticket = locData.tickets[openTkId];
  if(!ticket) return;

  const s    = ticket.s || "red";
  const info = STATUS_INFO[s] || { label: s };

  // Status buttons
  const statusBtns = STATUS_FLOW.map(st => {
    const si  = STATUS_INFO[st];
    const cur = s===st ? " cur" : "";
    return `<button class="status-btn b-${st}${cur}" onclick="window.setStatus('${openLid}','${openTkId}','${st}')">${esc(si.label)}</button>`;
  }).join("");

  // Notes (what camera tracker calls notes)
  const notes = Array.isArray(ticket.notes) ? ticket.notes : [];
  const notesHtml = notes.length ? notes.map(n => {
    const imgHtml = n.photoUrl ? `<img class="note-img" src="${esc(n.photoUrl)}" onclick="window.lightbox('${esc(n.photoUrl)}')" title="Click for full size">` : "";
    return `<div class="note">
      <div class="note-meta">${esc(fmtDate(n.t))}</div>
      ${n.n ? `<div class="note-text">${esc(n.n)}</div>` : ""}
      ${imgHtml}
    </div>`;
  }).join("") : `<div style="color:var(--text2);font-size:13px">No notes yet.</div>`;

  $("sheet").innerHTML = `
    <div class="sheet-h">
      <h2>${esc(locName(openLid))}</h2>
      <button class="x" onclick="window.closeModal()">✕ Close</button>
    </div>
    <div class="sheet-b">
      <div class="field-label">Address</div>
      <div class="val">${esc(locAddr(openLid)||"—")}</div>

      <div class="field-label">Status</div>
      <div class="status-row">${statusBtns}</div>

      <div class="field-label">Visit Date</div>
      <input class="date-in" type="date" id="editV" value="${esc(ticket.v||"")}">

      <div class="field-label">Issue / Notes</div>
      <textarea class="issue-in" id="editIssue" placeholder="Describe the camera issue…">${esc(ticket.issue||"")}</textarea>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn" onclick="window.saveEdits('${openLid}','${openTkId}')" style="flex:1">💾 Save</button>
      </div>

      <div class="field-label" style="margin-top:18px">Notes history</div>
      <div class="notes" id="notesList">${notesHtml}</div>

      <div class="field-label">Add note</div>
      <textarea class="note-in" id="noteIn" placeholder="Type a note…"></textarea>
      <div style="margin-top:4px">
        <input type="file" accept="image/*" id="noteFile" style="display:none" onchange="window.uploadNotePhoto('${openLid}','${openTkId}',this)">
        <button class="btn btn-primary" id="noteSendBtn" onclick="window.postNote('${openLid}','${openTkId}')" style="margin-top:8px">Post note</button>
        <button class="btn" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);margin-top:8px;margin-left:6px" onclick="document.getElementById('noteFile').click()">📎 Attach photo</button>
      </div>
      <div class="upload-note" id="uploadStatus"></div>
    </div>`;
}

window.closeModal = function(){
  $("modal").classList.remove("on");
  document.body.style.overflow = "";
  openLid  = null;
  openTkId = null;
};

window.lightbox = function(u){ $("lightboxImg").src=u; $("lightbox").classList.add("on"); };

// ── Writes ────────────────────────────────────────────────────────────────────
window.setStatus = async function(lid, tkId, newStatus){
  const locData = DATA[lid];
  if(!locData || !locData.tickets || !locData.tickets[tkId]) return;
  const existing = locData.tickets[tkId];
  if(existing.s === newStatus) return;
  const updated = { ...existing, s: newStatus };
  try{
    await set(ref(db, `jobs/${lid}/tickets/${tkId}`), updated);
    // Optimistic local update
    DATA[lid].tickets[tkId] = updated;
    toast("Status → " + STATUS_INFO[newStatus].label);
    renderSheet();
    render();
  }catch(e){ toast("Update failed: " + e.message, "err"); }
};

window.saveEdits = async function(lid, tkId){
  const locData = DATA[lid];
  if(!locData || !locData.tickets || !locData.tickets[tkId]) return;
  const existing = locData.tickets[tkId];
  const btn = $("saveBtn"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving…'; }
  const visitDate = ($("editV") && $("editV").value) || existing.v || "";
  const issueText = ($("editIssue") && $("editIssue").value.trim()) || existing.issue || "";
  const updated   = { ...existing, v: visitDate, issue: issueText };
  try{
    await set(ref(db, `jobs/${lid}/tickets/${tkId}`), updated);
    DATA[lid].tickets[tkId] = updated;
    toast("Saved ✓");
    renderSheet();
    render();
  }catch(e){ toast("Save failed: " + e.message, "err"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="💾 Save"; } }
};

window.postNote = async function(lid, tkId){
  const inp = $("noteIn"); const text = (inp && inp.value || "").trim();
  if(!text){ toast("Write something first","err"); return; }
  const btn = $("noteSendBtn"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span>'; }
  const locData = DATA[lid];
  const existing = locData && locData.tickets && locData.tickets[tkId];
  if(!existing){ toast("Ticket not found","err"); if(btn){btn.disabled=false;btn.textContent="Post note";} return; }
  const notes = [...(existing.notes||[])];
  notes.push({ n: text, t: new Date().toISOString() });
  const updated = { ...existing, notes };
  try{
    await set(ref(db, `jobs/${lid}/tickets/${tkId}`), updated);
    DATA[lid].tickets[tkId] = updated;
    toast("Note posted");
    renderSheet();
  }catch(e){ toast("Failed: " + e.message, "err"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="Post note"; } }
};

window.uploadNotePhoto = async function(lid, tkId, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ toast("Please choose an image file.","err"); inputEl.value=""; return; }
  const status = $("uploadStatus"); const btn = $("noteSendBtn");
  if(status) status.textContent = "Uploading photo…";
  if(btn) btn.disabled = true;
  try{
    const fd = new FormData(); fd.append("image", file);
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:"POST", body:fd });
    const json = await res.json();
    if(!json.success) throw new Error((json.error && json.error.message) || "Upload failed");
    const photoUrl = json.data.url;

    // Append as a note with the photo
    const noteText = ($("noteIn") && $("noteIn").value.trim()) || "";
    const locData  = DATA[lid];
    const existing = locData && locData.tickets && locData.tickets[tkId];
    if(!existing) throw new Error("Ticket not found");
    const notes = [...(existing.notes||[])];
    const newNote = { n: noteText, t: new Date().toISOString(), photoUrl };
    notes.push(newNote);
    const updated = { ...existing, notes };
    await set(ref(db, `jobs/${lid}/tickets/${tkId}`), updated);
    DATA[lid].tickets[tkId] = updated;
    if($("noteIn")) $("noteIn").value = "";
    toast("Photo note added");
    renderSheet();
  }catch(e){
    toast("Upload failed: " + e.message, "err");
  }finally{
    if(status) status.textContent = "";
    if(btn) btn.disabled = false;
    inputEl.value = "";
  }
};

// ── Live listener ─────────────────────────────────────────────────────────────
function updateSubHeader(){
  const open = openLocs().length;
  const total = Object.values(DATA).filter((_,i) => {
    const lid = Object.keys(DATA)[i];
    return !isSpecial(lid);
  }).length;
  $("boardSub").textContent = `${open} open job${open===1?"":"s"} · ${Object.keys(DATA).length} locations tracked`;
}

onValue(ref(db, "jobs"), snap => {
  DATA = snap.val() || {};
  $("poll").textContent = "live";
  $("boardTitle").textContent = BOARD_TITLE;
  updateSubHeader();
  render();
  // Refresh open sheet if data changed under it
  if(openLid && openTkId && DATA[openLid]) {
    const active = document.activeElement;
    const typing = active && (active.id === "noteIn" || active.id === "editIssue");
    if(!typing) renderSheet();
  }
});

document.title = BOARD_TITLE;
</script>
